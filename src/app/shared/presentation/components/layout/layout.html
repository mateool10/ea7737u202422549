<mat-toolbar color="primary">
  <button mat-button (click)="sidenav.toggle()" [attr.aria-label]="'menu' | translate">Menu</button>
  <img src="assets/urbanfit-logo.svg" [alt]="'app-logo' | translate" width="40" height="40">
  <span>{{ 'app-title' | translate }}</span>
  <span class="spacer"></span>
  <app-language-switcher/>
</mat-toolbar>

<mat-sidenav-container class="container">
  <mat-sidenav #sidenav mode="side" opened>
    <mat-nav-list aria-label="Main navigation">
      <a mat-list-item routerLink="/home">{{ 'home' | translate }}</a>
      <a mat-list-item routerLink="/reservations/new">{{ 'new-reservation' | translate }}</a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <main class="content">
      <router-outlet/>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
