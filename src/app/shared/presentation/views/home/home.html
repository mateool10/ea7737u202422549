<h1>{{ 'home' | translate }}</h1>
<p>{{ 'home-content' | translate }}</p>

<h2>{{ 'my-sports-centers' | translate }}</h2>
<mat-grid-list cols="2" rowHeight="300px" gutterSize="16px">
  @for (sportsCenter of store.sportsCenters(); track sportsCenter.id) {
    <mat-grid-tile>
      <app-sports-center-summary [sportsCenter]="sportsCenter"/>
    </mat-grid-tile>
  }
</mat-grid-list>
